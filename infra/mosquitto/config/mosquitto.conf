# Mosquitto 설정 — 가상 위성 지상국 (로컬 개발용)

# MQTT 리스너: 컨테이너 내부 1883 포트 (호스트에는 127.0.0.1로만 노출)
listener 1883

# ⚠️ 로컬 개발 전용: 인증 없이 접속 허용. 운영 환경에서는 반드시 false + password_file 사용
allow_anonymous true

# 메시지/구독 상태 영속화
persistence true
persistence_location /mosquitto/data/

# 로그는 stdout으로 (docker compose logs 로 확인)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
